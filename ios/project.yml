name: VibeOS
options:
  bundleIdPrefix: com.vibeos
  deploymentTarget: {iOS: '17.0'}
settings:
  base:
    SWIFT_VERSION: '5.10'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
targets:
  VibeOS:
    type: application
    platform: iOS
    sources:
      - path: VibeOS
      - path: ../shared/catalog.json
        buildPhase: resources
      - path: ../shared/artworks
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeos.app
        INFOPLIST_FILE: VibeOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: VibeOS/VibeOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: RevenueCat
        product: RevenueCat
      - target: VibeOSWidget
        embed: true
  VibeOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VibeOSWidget
      - path: ../shared/catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeos.app.widget
        INFOPLIST_FILE: VibeOSWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VibeOSWidget/VibeOSWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
