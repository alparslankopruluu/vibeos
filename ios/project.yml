name: VibeOS
options:
  bundleIdPrefix: com.vibeos
  deploymentTarget:
    iOS: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0

targets:
  VibeOS:
    type: application
    platform: iOS
    sources:
      - path: VibeOS
        excludes:
          - Widgets/**
          - NotificationService/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeos.app
        PRODUCT_NAME: VibeOS
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: VibeOS/VibeOS.entitlements
        VIBE_REVENUECAT_API_KEY: ""
    info:
      path: VibeOS/Info.plist
      properties:
        CFBundleDisplayName: VibeOS
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: VibeOS saves wallpapers you choose so you can set them from Photos.
        NSPhotoLibraryUsageDescription: VibeOS can use a photo you select to create a personalized theme.
        UIBackgroundModes:
          - remote-notification
        VIBE_REVENUECAT_API_KEY: $(VIBE_REVENUECAT_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vibeos
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: RevenueCat
        product: RevenueCat
      - target: VibeOSWidgets
        embed: true
      - target: NotificationService
        embed: true
    postBuildScripts:
      - name: Firebase Crashlytics dSYM
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "$PROJECT_DIR/VibeOS/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          else
            echo "Skipping Crashlytics upload: GoogleService-Info.plist is not configured."
          fi

  VibeOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VibeOS/Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeos.app.widgets
        SWIFT_VERSION: 5.0
        SKIP_INSTALL: YES
    info:
      path: VibeOS/Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: VibeOS/NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibeos.app.NotificationService
        SWIFT_VERSION: 5.0
        SKIP_INSTALL: YES
    info:
      path: VibeOS/NotificationService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
